name: validate-plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compila lo script di pulizia liste
        run: python -m py_compile skills/pulisci-liste-crm/scripts/crm-list-cleanup.py
      - name: Valida plugin (white-label, JSON, skill, reference)
        run: python scripts/validate-plugin.py
