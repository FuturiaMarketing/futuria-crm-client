<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulisci liste — Futuria CRM</title>
<style>
  :root{
    --pur:#534AB7; --pur-bg:#EEEDFE; --red:#A32D2D; --red-bg:#FCEBEB;
    --grn:#0F6E56; --grn-bg:#E1F5EE; --ink:#26215C; --bd:#E4E2EE;
    --mut:#6b6878; --hint:#908ca0; --bg:#F7F6FB; --srf:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:#201d2b;
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;}
  .wrap{max-width:680px; margin:0 auto; padding:1.6rem 1.1rem 4rem;}
  .h{display:flex; align-items:center; gap:.5rem; font-size:20px; font-weight:600; color:var(--ink);}
  .sub{color:var(--mut); font-size:14px; margin:.3rem 0 1.1rem;}
  .meta-top{display:inline-block; font-size:12px; color:var(--mut);
            background:var(--pur-bg); border-radius:999px; padding:.15rem .6rem; margin-bottom:1rem;}
  .card{background:var(--srf); border:1px solid var(--bd); border-left:4px solid var(--red);
        border-radius:10px; padding:.85rem .95rem; margin-bottom:.7rem;}
  .top{display:flex; align-items:flex-start; justify-content:space-between; gap:.7rem;}
  .idwrap{display:flex; gap:.6rem; align-items:center; min-width:0;}
  .av{width:36px; height:36px; border-radius:999px; background:var(--bg); border:1px solid var(--bd);
      display:flex; align-items:center; justify-content:center; color:var(--mut);
      font-size:13px; font-weight:600; flex:0 0 auto;}
  .name{font-weight:600; overflow-wrap:anywhere;}
  .name.empty{color:var(--mut); font-weight:500;}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; overflow-wrap:anywhere;}
  .email{color:var(--mut);}
  .meta{color:var(--mut); font-size:13px; margin-top:.2rem;}
  .badge{font-size:11px; font-weight:600; border-radius:999px; padding:.12rem .55rem;
         background:var(--red-bg); color:var(--red); white-space:nowrap;}
  .sigs{display:flex; flex-wrap:wrap; gap:.35rem; margin:.55rem 0 .1rem;}
  .chip{font-size:12px; color:var(--mut); background:var(--bg); border:1px solid var(--bd);
        border-radius:999px; padding:.12rem .55rem;}
  .row{display:flex; align-items:center; justify-content:flex-end; gap:.7rem; margin-top:.6rem;}
  .seg{display:inline-flex; border:1px solid var(--bd); border-radius:999px; overflow:hidden;}
  .seg button{font:inherit; font-size:13px; padding:.3rem .85rem; background:transparent;
              color:var(--mut); border:0; cursor:pointer;}
  .seg button.on[data-act="elimina"]{background:var(--red-bg); color:var(--red); font-weight:600;}
  .seg button.on[data-act="tieni"]{background:var(--grn-bg); color:var(--grn); font-weight:600;}
  .bar{position:sticky; bottom:0; display:flex; align-items:center; justify-content:space-between;
       gap:1rem; flex-wrap:wrap; background:var(--srf); border:1px solid var(--bd);
       border-radius:10px; padding:.7rem .95rem; margin-top:.5rem;}
  .actions{display:flex; gap:.5rem; align-items:center;}
  .linklike{font:inherit; font-size:13px; background:transparent; border:0; color:var(--pur);
            cursor:pointer; text-decoration:underline;}
  #count{font-weight:600;}
  #go{font:inherit; font-size:14px; font-weight:600; padding:.5rem 1rem; border-radius:8px;
      border:1px solid var(--pur); background:var(--pur); color:#fff; cursor:pointer;}
  #go:disabled{opacity:.45; cursor:default;}
  .done{text-align:center; padding:3.5rem 1rem; color:var(--grn); font-size:18px; font-weight:600;}
  .done small{display:block; color:var(--mut); font-weight:400; font-size:14px; margin-top:.6rem;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
  const DATA = /*__DATA__*/null;

  function initials(name){
    if(!name || name === "(senza nome)") return "?";
    return name.split(/\s+/).slice(0,2).map(w => w[0] ? w[0].toUpperCase() : "").join("") || "?";
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, c =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  }

  const state = {};
  (DATA.candidates || []).forEach(c => { state[c.id] = "elimina"; });

  function render(){
    const cs = DATA.candidates || [];
    const cards = cs.map(c => {
      const empty = (!c.name || c.name === "(senza nome)");
      const sigs = (c.signals || []).map(s => `<span class="chip">${esc(s)}</span>`).join("");
      const metaBits = [c.dateAdded ? "creato " + esc(c.dateAdded) : "",
                        c.source ? "source " + esc(c.source) : "",
                        c.phone ? "tel presente" : "no telefono"].filter(Boolean).join(" · ");
      return `
      <div class="card" id="card-${esc(c.id)}" data-id="${esc(c.id)}">
        <div class="top">
          <div class="idwrap">
            <div class="av">${esc(initials(c.name))}</div>
            <div style="min-width:0">
              <div class="name${empty ? " empty" : ""}">${esc(c.name)}</div>
              <div class="mono email">${esc(c.email) || "—"}</div>
            </div>
          </div>
          <span class="badge">delete-grade</span>
        </div>
        <div class="meta">${metaBits}</div>
        <div class="sigs">${sigs}</div>
        <div class="row">
          <span class="seg" role="group" aria-label="decisione">
            <button type="button" data-act="tieni" onclick="setDec('${esc(c.id)}','tieni')">tieni</button>
            <button type="button" data-act="elimina" class="on" onclick="setDec('${esc(c.id)}','elimina')">elimina</button>
          </span>
        </div>
      </div>`;
    }).join("");

    document.getElementById("app").innerHTML = `
      <div class="h">Pulisci liste — Futuria CRM</div>
      <div class="sub">Rivedi i contatti segnalati come sospetti. Marca <b>tieni</b> o <b>elimina</b>, poi conferma: le scelte tornano allo strumento locale.</div>
      <div class="meta-top">${esc(DATA.candidates.length)} candidati su ${esc(DATA.total)} contatti analizzati</div>
      ${cards}
      <div class="bar">
        <span id="count"></span>
        <div class="actions">
          <button class="linklike" onclick="setAll('tieni')">tieni tutti</button>
          <button class="linklike" onclick="setAll('elimina')">elimina tutti</button>
          <button id="go" onclick="submitDecs()"></button>
        </div>
      </div>`;
    summary();
  }

  function setDec(id, d){
    state[id] = d;
    const card = document.getElementById("card-" + id);
    card.querySelectorAll("[data-act]").forEach(b => b.classList.toggle("on", b.getAttribute("data-act") === d));
    card.style.borderLeftColor = (d === "elimina") ? "#A32D2D" : "#0F6E56";
    summary();
  }
  function setAll(d){
    (DATA.candidates || []).forEach(c => setDec(c.id, d));
  }
  function summary(){
    let del = 0, keep = 0;
    Object.keys(state).forEach(k => state[k] === "elimina" ? del++ : keep++);
    document.getElementById("count").textContent = del + " da eliminare · " + keep + " da tenere";
    const b = document.getElementById("go");
    b.textContent = "Conferma eliminazioni (" + del + ")";
    b.disabled = (del === 0);
  }
  function submitDecs(){
    const byId = {};
    (DATA.candidates || []).forEach(c => { byId[c.id] = c; });
    const del = [], keep = [];
    Object.keys(state).forEach(id => {
      const c = byId[id] || {id};
      (state[id] === "elimina" ? del : keep).push({id: id, email: c.email || "", name: c.name || ""});
    });
    fetch("/submit", {method:"POST", headers:{"Content-Type":"application/json"},
                      body: JSON.stringify({delete: del, keep: keep, client: DATA.client})})
      .then(r => r.json())
      .then(() => {
        document.getElementById("app").innerHTML =
          '<div class="done">Decisioni inviate.<small>Lo strumento ha ricevuto ' + del.length +
          ' da eliminare e ' + keep.length + ' da tenere. Puoi chiudere questa scheda e tornare alla chat.</small></div>';
      })
      .catch(e => alert("Errore invio: " + e));
  }

  render();
</script>
</body>
</html>
